# Cross-file to cross-compile the miniBox host as a Windows DLL with mingw-w64.
# Used to compile-check the Windows PAL / fault handler / ABI adapter. The
# resulting waterboxhost.dll is not runtime-validated on Linux.
#
#   meson setup build-win --cross-file cross/mingw-w64.ini
#   ninja -C build-win runtime-c/miniboxhost.dll  (or: meson compile -C build-win)

[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
