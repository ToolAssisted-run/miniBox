# Cross-file to cross-compile the miniBox host as a Windows DLL with mingw-w64.
# Lives in source/host/ (the host build config). Used to compile-check the
# Windows PAL / fault handler / ABI adapter; the resulting DLL is not
# runtime-validated on Linux.
#
#   meson setup build/meson-windows --cross-file source/host/mingw-w64.ini
#   ninja -C build/meson-windows source/host/libminiboxhost.dll

[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
